[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lpopt"
version = "0.1.0"
description = "SGD, Momentum, Adam and AdamW written from scratch in NumPy, checked against torch.optim and studied in low precision"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amine Belkacem" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
# torch is only the reference in the tests, lpopt itself never imports it.
dev = ["torch>=2.2", "scikit-learn>=1.4", "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes experiments/ importable: the torch comparison lives there and
# the tests reuse it rather than duplicating it.
pythonpath = ["src", "."]
